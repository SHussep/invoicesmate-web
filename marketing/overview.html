<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Invoice Mate — overview image</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #e7f1ed;
        color: #142338;
      }
      main {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        text-align: center;
        padding: 55px 65px;
      }
      .brand {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        font-size: 25px;
        font-weight: 650;
        letter-spacing: -0.9px;
      }
      .brand img {
        width: 43px;
        height: 43px;
      }
      .eyebrow {
        font-size: 11px;
        color: #175de5;
        font-weight: 650;
        letter-spacing: 2.6px;
        margin: 38px 0 14px;
      }
      h1 {
        font-size: 65px;
        line-height: 1.04;
        letter-spacing: -3px;
        margin: 0;
        font-weight: 650;
      }
      p {
        font-size: 20px;
        line-height: 1.6;
        color: #53647a;
        margin: 19px 0 0;
      }
      .phone {
        position: absolute;
        top: 428px;
        left: calc(50% - 183px);
        width: 366px;
        border: 8px solid #172332;
        background: #172332;
        border-radius: 48px;
        box-shadow:
          0 0 0 1px #8793a0,
          0 20px 38px #17315729;
        overflow: hidden;
      }
      .phone img {
        display: block;
        width: 100%;
        border-radius: 37px;
      }
      .foot {
        position: absolute;
        bottom: 27px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
        font-size: 11px;
        color: #596779;
      }
      .foot strong {
        color: #175de5;
        font-weight: 650;
      }
      .phone::after {
        content: "";
        position: absolute;
        pointer-events: none;
        width: 29%;
        height: 3.2%;
        top: 1.1%;
        left: 35.5%;
        background: #080d14;
        border-radius: 100px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/images/InvoicesMateLogoTransparent.png" alt="" />Invoice Mate
      </div>
      <div class="eyebrow">SEE THE BIGGER PICTURE</div>
      <h1>A little clarity.<br />Every day.</h1>
      <p>Income, expenses and outstanding<br />invoices at a glance.</p>
      <div class="phone">
        <img
          src="/screens/dashboard.png"
          alt="Real Invoice Mate overview screen"
        />
      </div>
      <div class="foot">
        <strong>syainvoices.com</strong
        ><span>Real app screen · Fictional demo data</span>
      </div>
    </main>
  </body>
</html>
